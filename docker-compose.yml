services:
  builder:
    # Local development service with Xdebug enabled
    build:
      context: .
      dockerfile: Dockerfile
      target: develop
      args:
        PHP_VERSION: ${PHP_VERSION:-8.5}
    volumes:
      - .:/mozart/
    command: /bin/sh -c "while sleep 1000; do :; done"
  actions-tester:
    # CI testing service without Xdebug (faster builds)
    # No volume mounted - uses files copied into the container at build time
    # In CI: uses pre-built mozart:latest image if available
    # Locally: builds from Dockerfile
    image: mozart:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
      args:
        PHP_VERSION: ${PHP_VERSION:-8.5}
    command: /bin/sh -c "while sleep 1000; do :; done"
